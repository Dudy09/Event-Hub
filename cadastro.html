<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Event Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <header class="site-header">
        <div class="logo-header">
            <img src="assets/Tipografia-logo-1-com-ingresso-grudado.png" alt="Event Hub">
        </div>
        <nav class="menu">
            <a href="home-page.html">Home</a>
            <a href="pagina-eventos.html">Eventos</a>
            <a href="index.html" class="ativo">Sobre nós</a>
            <a href="login.html">Entrar</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="contato.html">Contato</a>
            <img src="assets/icon_notificacao.png" style="width: 35px; height: 35px;">

            <div id="overlay" class="overlay"></div>

            <button id="menu-btn" class="btn-toggle">☰ Menu</button>
        </nav>
    </header>

    <main class="conteudo-cadastro">
        <div class="container-tela">
            <div class="texto-centralizado">
                <h1>Cadastre-se</h1>
                <p>Escolha como você quer se cadastrar:</p>
            </div>
        </div>

        <div class="container-cadastro">
            <div class="opcao-cadastro">
                <div class="icone-circulo">
                    <img src="assets/icon_pessoa.webp" style="width: 85px; height: 85px;">
                </div>
                <h2>Usuário</h2>
                <p>Acesse eventos, compre seus ingressos e gerencie sua conta.</p>
                <a href="usuario/cadastro_usuario.html" class="seta-avancar">→</a>
            </div>

            <div class="opcao-cadastro">
                <div class="icone-circulo">
                    
                </div>
                <h2>Empresa</h2>
                <p>Cadastre sua empresa, crie eventos e gerencie seu perfil</p>
                <a href="empresa/cadastro_empresa.html" class="seta-avancar">→</a>
            </div>
        </div>
    </main>

    <a href="index.html" class="voltar-login">← Voltar para o login</a>

</html>
