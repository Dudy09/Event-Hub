<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Event Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cadastro_usuario.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="logo-header">
            <img src="../assets/Tipografia-logo-1-com-ingresso-grudado.png" alt="Event Hub">
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="sobre_nos.html">Sobre</a>
            <a href="#">Contatos</a>
            <a href="#">Lojas da EventHub</a>
        </nav>
    </header>

    <main class="conteudo-cadastro">

    <article>
        <div style="justify-content: space-evenly; display: flex; align-items: center;  margin-bottom: 20px; margin-top: 20px;">
            <p>Dados Pessoais</p>
            <p>Meios de contato</p>
            <p>Endereço</p>
            <p>Segurança</p>
        </div>

        <div style="display: flex;">
            <div style="background-color: rgb(210, 210, 212); width: 80%; margin-left: 10%; border-radius: 25px; padding: 20 0 20 0; min-height: 30px;">
                <div style="background-color: blue; width: 75%; border-radius: 25px; padding: 20 0 20 0; min-height: 30px;">
                
                </div>
            </div>
            <div style="margin-left: 10px; margin-top: 2.5px;">
                <p>75%</p>
            </div>
        </div>
    </article>

    <section style="padding: 50px 150px 0px 150px;">
        <div style="padding: 0px 0px 30px 0px;">
            <h1>Endereço</h1>
        </div>

        <article>
            <form>
                <section class="conteudo-centro">
                    <div alt="nome" class="grid-tem">
                        <h2>CEP *</h2>
                        <input type="number" class="teste" maxlength="100" placeholder="00000-000">
                    </div>
                    <div alt="Data de Nascimento" class="grid-tem">
                        <h2>Bairro *</h2>
                        <input type="text" class="teste">
                    </div>
                    <div alt="numero do cpf" class="grid-tem">
                        <h2>Rua *</h2>
                        <input type="text" class="teste" maxlength="" placeholder="">
                    </div>
                    <div alt="numero do rg" class="grid-tem">
                        <h2>Cidade *</h2>
                        <input type="text" class="teste" maxlength="" placeholder="">
                    </div>
                    <div alt="numero do cpf" class="grid-tem">
                        <h2>Número *</h2>
                        <input type="text" class="teste" maxlength="" placeholder="">
                    </div>
                    <div alt="numero do rg" class="grid-tem">
                        <h2>Estado *</h2>
                        <input type="text" class="teste" maxlength="" placeholder="">
                    </div>
                </section>
                <div style="justify-content: flex-end; align-items: end; margin: 50px 50px 0px 50px; display: flex;">
                    <input type="submit" value="Próximo →" class="botao_compra">
                </div>
            </form>
            <div style="align-items: end; margin: 80px 0px 0px -150px; width: 100%; display: grid; position: absolute">
                <a h.ref="index.html" class="voltar-login">← Voltar para o login</a>
            </div>
        </article>
    </section>

    </main>


</body>
</html>
