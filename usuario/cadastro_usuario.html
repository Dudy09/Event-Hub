<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Event Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cadastro.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <header class="site-header">
        <div class="logo-header">
            <img src="assets/Tipografia-logo-1-com-ingresso-grudado.png" alt="Event Hub">
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="sobre_nos.html">Sobre</a>
            <a href="#">Contatos</a>
            <a href="#">Lojas da EventHub</a>
        </nav>
    </header>

    <main class="conteudo-cadastro">
 
        <div class="container-tela">
            <div class="texto-centralizado">
                <h1>Cadastre - se</h1>
                <p>Escolha como você quer se cadastrar:</p>
            </div>
        </div>
 
        <div class="container-cadastro">
 
            <div class="opcao-cadastro">
                <div class="icone-circulo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg>
                </div>
                <h2>Usuário</h2>
                <p>Acesse eventos, compre seus ingressos e gerencie sua conta.</p>
                <a href="usuario/cadastro_usuario.html" class="seta-avancar">→</a>
            </div>
 
            <div class="opcao-cadastro">
                <div class="icone-circulo">
                    <i class="fas fa-building"></i>
                </div>
                <h2>Empresa</h2>
                <p>Cadastre sua empresa, crie eventos e gerencie seu perfil</p>
                <a href="empresa/cadastro_empresa.html" class="seta-avancar">→</a>
            </div>
 
        </div>
 
    </main>
 
    <a href="index.html" class="voltar-login">← Voltar para o login</a>
    



</body>
</html>
