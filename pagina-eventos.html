<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Lateral</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    display: flex; /* Coloca o menu e o conteúdo lado a lado */
}

/* Estilo do Menu Lateral */
.menu-lateral {
    width: 250px;
    height: 100vh; /* Ocupa 100% da altura da tela */
    background-color: #2c3e50;
    color: #fff;
    position: fixed; /* Mantém o menu fixo ao rolar a página */
    top: 0;
    left: 0;
    padding: 20px;
}

.menu-lateral h2 {
    margin-bottom: 30px;
    text-align: center;
}

.menu-lateral ul {
    list-style: none; /* Remove as bolinhas da lista */
}

.menu-lateral ul li {
    margin: 15px 0;
}

.menu-lateral ul li a {
    color: #fff;
    text-decoration: none; /* Remove o sublinhado dos links */
    display: block;
    padding: 10px;
    border-radius: 4px;
    transition: background 0.3s;
}

.menu-lateral ul li a:hover {
    background-color: #34495e; /* Efeito hover ao passar o mouse */
}

/* Ajuste do Conteúdo Principal para não ficar debaixo do menu */
.conteudo {
    margin-left: 250px; /* Mesma largura do menu lateral */
    padding: 40px;
    width: calc(100% - 250px);
}

    </style>

</head>
<body>

    <!-- Menu Lateral -->
    <nav class="menu-lateral">
        <h2>MeuSite</h2>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Perfil</a></li>
            <li><a href="#">Serviços</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="conteudo">
        <h1>Bem-vindo!</h1>
        <p>Este é o conteúdo principal da página.</p>
    </main>

</body>
</html>
